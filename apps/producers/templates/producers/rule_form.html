{% extends 'base.html' %}
{% block title %}Collection times{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h1 class="h3">Collection times at {{ point.name }}</h1>
  <p class="text-muted">Slots are created for the next two weeks and kept topped up every day.</p>
  <div class="card shadow-sm"><div class="card-body p-4">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'core/includes/form.html' %}
      <button class="btn btn-success">Save</button>
      <a class="btn btn-link" href="{% url 'producers:points' %}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
